<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRC Part Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            height: 85vh;
            max-height: 720px;
            overflow: hidden;
        }

        .header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .header-sub {
            font-size: 13px;
            color: #999;
            margin-top: 2px;
        }

        #resetBtn {
            background: none;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }

        #resetBtn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            background: #667eea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }

        .message.assistant {
            background: #f2f2f2;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 3px;
        }

        .message.system-msg {
            background: #fff8e1;
            color: #7a6500;
            align-self: center;
            font-size: 13px;
            border: 1px solid #ffe082;
            max-width: 90%;
            text-align: center;
        }

        .message.error-msg {
            background: #fdf0ef;
            color: #c0392b;
            align-self: center;
            font-size: 13px;
            border: 1px solid #f5c6c2;
            max-width: 90%;
        }

        .complete-card {
            background: #f0faf4;
            border: 2px solid #27ae60;
            border-radius: 10px;
            padding: 16px;
            align-self: stretch;
            max-width: 100%;
        }

        .complete-card .done-label {
            font-size: 13px;
            font-weight: 700;
            color: #27ae60;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .complete-card pre {
            background: #fff;
            border: 1px solid #d4edda;
            border-radius: 6px;
            padding: 12px;
            font-size: 13px;
            line-height: 1.6;
            overflow-x: auto;
            white-space: pre-wrap;
            color: #2c3e50;
        }

        .thinking {
            align-self: flex-start;
            color: #aaa;
            font-size: 14px;
            padding: 8px 4px;
            font-style: italic;
        }

        .input-row {
            padding: 14px 24px 20px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        #chatInput {
            flex: 1;
            padding: 11px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
            resize: none;
            font-family: inherit;
            line-height: 1.4;
        }

        #chatInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #chatInput:disabled {
            background: #fafafa;
            color: #999;
        }

        #sendBtn {
            padding: 11px 22px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            align-self: flex-end;
        }

        #sendBtn:hover:not(:disabled) {
            background: #5568d3;
        }

        #sendBtn:active:not(:disabled) {
            transform: scale(0.97);
        }

        #sendBtn:disabled {
            background: #bbb;
            cursor: not-allowed;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #bbb;
            font-size: 15px;
            gap: 8px;
        }

        .empty-state .icon {
            font-size: 36px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <div class="header h1">FRC Part Chat</div>
                <div class="header-sub">Describe the part you need — we'll figure out the details together.</div>
            </div>
            <button id="resetBtn" onclick="resetChat()">Start over</button>
        </div>

        <div id="messages">
            <div class="empty-state" id="emptyState">
                <span class="icon">🔧</span>
                <span>Describe an FRC part to get started.</span>
                <span style="font-size:13px;">e.g. "I need a gusset for two 2x1 tubes at 90 degrees"</span>
            </div>
        </div>

        <div class="input-row">
            <textarea
                id="chatInput"
                placeholder="Describe your part..."
                rows="1"
                autocomplete="off"
            ></textarea>
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/chat-parse';

        let conversation = [];
        let done = false;

        const messagesEl = document.getElementById('messages');
        const emptyState = document.getElementById('emptyState');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        // Auto-grow textarea
        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
        });

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function appendBubble(role, text) {
            hideEmptyState();
            const el = document.createElement('div');
            el.className = `message ${role}`;
            el.textContent = text;
            messagesEl.appendChild(el);
            scrollToBottom();
            return el;
        }

        function appendCompleteCard(orderForm) {
            hideEmptyState();
            const card = document.createElement('div');
            card.className = 'complete-card';
            card.innerHTML = `
                <div class="done-label">✓ Order form complete</div>
                <pre>${JSON.stringify(orderForm, null, 2)}</pre>
            `;
            messagesEl.appendChild(card);
            scrollToBottom();
        }

        function appendThinking() {
            hideEmptyState();
            const el = document.createElement('div');
            el.className = 'thinking';
            el.textContent = 'Thinking…';
            messagesEl.appendChild(el);
            scrollToBottom();
            return el;
        }

        function appendError(text) {
            const el = document.createElement('div');
            el.className = 'message error-msg';
            el.textContent = text;
            messagesEl.appendChild(el);
            scrollToBottom();
        }

        function hideEmptyState() {
            if (emptyState) emptyState.style.display = 'none';
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function setLoading(loading) {
            chatInput.disabled = loading;
            sendBtn.disabled = loading;
        }

        async function sendMessage() {
            if (done) return;

            const text = chatInput.value.trim();
            if (!text) return;

            chatInput.value = '';
            chatInput.style.height = 'auto';

            conversation.push({ role: 'user', content: text });
            appendBubble('user', text);

            setLoading(true);
            const thinkingEl = appendThinking();

            try {
                const resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: conversation }),
                });

                thinkingEl.remove();

                if (!resp.ok) {
                    throw new Error(`HTTP ${resp.status}`);
                }

                const data = await resp.json();

                if (data.status === 'complete') {
                    done = true;
                    conversation.push({ role: 'assistant', content: 'Order form complete.' });
                    appendCompleteCard(data.order_form);
                    setLoading(true); // keep disabled — conversation is done
                    sendBtn.textContent = 'Done';
                } else if (data.status === 'incomplete') {
                    const msg = data.message || 'Could you tell me more?';
                    conversation.push({ role: 'assistant', content: msg });
                    appendBubble('assistant', msg);
                    setLoading(false);
                    chatInput.focus();
                } else {
                    // status === 'error' or unexpected
                    appendError(data.message || 'An unexpected error occurred. Please try again.');
                    setLoading(false);
                    chatInput.focus();
                }
            } catch {
                thinkingEl.remove();
                appendError('Could not reach the backend. Is it running on localhost:8000?');
                setLoading(false);
                chatInput.focus();
            }
        }

        function resetChat() {
            conversation = [];
            done = false;
            messagesEl.innerHTML = '';
            messagesEl.appendChild(emptyState);
            emptyState.style.display = '';
            sendBtn.textContent = 'Send';
            setLoading(false);
            chatInput.focus();
        }
    </script>
</body>
</html>
