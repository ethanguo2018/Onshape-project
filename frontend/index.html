<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRC Text-to-CAD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        .result-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .result-label {
            font-size: 14px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .result-area {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            min-height: 60px;
            color: #333;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .result-area.empty {
            color: #ccc;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FRC Text-to-CAD</h1>
        
        <div class="input-group">
            <input 
                type="text" 
                id="partInput" 
                placeholder="Describe your part, e.g. gusset joining two 2x1 MAXTubes at 60 degrees"
                autocomplete="off"
            >
            <button onclick="handleSubmit()">Submit</button>
        </div>

        <div class="result-section">
            <div class="result-label">Parsed Result</div>
            <div class="result-area empty" id="resultArea">
                Parsed result will appear here
            </div>
        </div>
    </div>

    <script>
        // Get DOM elements
        const partInput = document.getElementById('partInput');
        const resultArea = document.getElementById('resultArea');

        /**
         * Handle submission of part description.
         * Currently echoes the input to the result area.
         * 
         * TODO: Replace echo logic with:
         *   1. POST input to backend /parse endpoint
         *   2. Parse JSON response
         *   3. Display formatted response in result area
         *   4. Handle errors gracefully
         */
        function handleSubmit() {
            const inputText = partInput.value.trim();

            if (!inputText) {
                resultArea.textContent = 'Please enter a part description';
                resultArea.classList.remove('empty');
                return;
            }

            // Echo the input (temporary behavior for frontend skeleton)
            resultArea.textContent = inputText;
            resultArea.classList.remove('empty');

            // Clear input for next submission
            partInput.value = '';
            partInput.focus();
        }

        // Allow Enter key to submit
        partInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                handleSubmit();
            }
        });

        // Focus input on page load
        partInput.focus();
    </script>
</body>
</html>
